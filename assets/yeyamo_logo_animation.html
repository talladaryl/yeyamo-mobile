<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Yeyamo — Animation logo premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
  :root{
    --dark-red:#d11c19;
    --light-red:#e8756a;
    --gray:#9a9a9a;
    --bg-1:#171010;
    --bg-2:#070505;
    --glow:rgba(224,64,55,0.55);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:#050404;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    height:100%;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse 60% 55% at 50% 42%, #2c1614 0%, transparent 72%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  }

  /* ---------- ambient background glow ---------- */
  .ambient-glow{
    position:absolute;
    left:50%; top:42%;
    width:120px; height:120px;
    transform:translate(-50%,-50%) scale(0.2);
    border-radius:50%;
    background:radial-gradient(circle, var(--glow) 0%, rgba(224,64,55,0.18) 40%, transparent 72%);
    filter:blur(18px);
    opacity:0;
    pointer-events:none;
    transition:opacity 1.4s ease, transform 2.6s cubic-bezier(.2,.7,.3,1), width 2.6s ease, height 2.6s ease;
  }
  .ambient-glow.bloom{
    opacity:1;
    width:820px; height:820px;
    transform:translate(-50%,-50%) scale(1);
  }
  .ambient-glow.pulse{
    animation: glowPulse 4.2s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{ opacity:0.75; transform:translate(-50%,-50%) scale(1); }
    50%{ opacity:1; transform:translate(-50%,-50%) scale(1.045); }
  }

  /* ---------- flash burst at reveal ---------- */
  .flash{
    position:absolute;
    left:50%; top:40%;
    width:60px; height:60px;
    transform:translate(-50%,-50%) scale(0);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,235,230,0.95) 0%, rgba(255,180,170,0.5) 35%, transparent 70%);
    filter:blur(2px);
    opacity:0;
    pointer-events:none;
  }
  .flash.fire{
    animation: flashBurst 0.9s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes flashBurst{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0); }
    35%{ opacity:0.9; transform:translate(-50%,-50%) scale(3.2); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(6.5); }
  }

  /* ---------- particle layer ---------- */
  .particle-layer, .sparkle-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .ember{
    position:absolute;
    bottom:-20px;
    border-radius:50%;
    opacity:0;
    background:radial-gradient(circle, #ffcfc4 0%, var(--light-red) 45%, transparent 75%);
    filter:blur(0.3px);
  }
  .ember.rise{
    animation-name: emberRise;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
  }
  @keyframes emberRise{
    0%{ opacity:0; transform:translate(0,0) scale(0.6); }
    12%{ opacity:var(--peak,0.8); }
    80%{ opacity:var(--peak,0.8); }
    100%{ opacity:0; transform:translate(var(--drift,20px), var(--rise,-560px)) scale(1); }
  }

  .sparkle{
    position:absolute;
    width:14px; height:14px;
    opacity:0;
    pointer-events:none;
  }
  .sparkle svg{ width:100%; height:100%; display:block; }
  .sparkle.twinkle{
    animation-name: sparkleTwinkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes sparkleTwinkle{
    0%,100%{ opacity:0; transform:scale(0.3) rotate(0deg); }
    50%{ opacity:0.9; transform:scale(1) rotate(20deg); }
  }

  /* ---------- logo lockup ---------- */
  .logo-wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:2;
    width:min(66vw, 400px);
  }

  /* ---- icon ---- */
  .sweep-wrap{
    position:relative;
    width:78%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    border-radius:12px;
  }
  #part-icon{
    display:block;
    width:100%;
    height:auto;
    opacity:0;
    filter:blur(16px) brightness(1.6);
    transform:translateY(14px) scale(0.9);
  }
  #part-icon.reveal{
    animation: materialize 1.05s cubic-bezier(.18,.8,.24,1) forwards;
  }
  @keyframes materialize{
    0%{ opacity:0; filter:blur(16px) brightness(1.6); transform:translateY(14px) scale(0.9); }
    55%{ opacity:1; filter:blur(2px) brightness(1.25); transform:translateY(0) scale(1.035); }
    100%{ opacity:1; filter:blur(0) brightness(1); transform:translateY(0) scale(1); }
  }
  .sweep{
    position:absolute;
    top:0; left:-60%;
    width:45%; height:100%;
    background:linear-gradient(75deg, transparent 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 70%, transparent 100%);
    mix-blend-mode:screen;
    opacity:0;
    pointer-events:none;
  }
  .sweep.run{
    animation: sweepMove 1.1s ease-out forwards;
  }
  @keyframes sweepMove{
    0%{ left:-60%; opacity:0; }
    12%{ opacity:0.9; }
    70%{ opacity:0.5; }
    100%{ left:130%; opacity:0; }
  }

  /* ---- wordmark: letter by letter ---- */
  .wordmark{
    margin-top:10px;
    display:flex;
    justify-content:center;
    line-height:1;
  }
  .wordmark .letter{
    display:inline-block;
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-style:italic;
    font-size:clamp(40px, 11vw, 68px);
    background:linear-gradient(160deg, var(--dark-red) 0%, var(--dark-red) 60%, var(--light-red) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,0.35));
    opacity:0;
    transform:translateY(22px) scale(0.75);
    will-change:transform,opacity,filter;
  }
  .wordmark.reveal .letter{
    animation: letterIn 0.62s cubic-bezier(.2,.85,.25,1.15) forwards;
  }
  .wordmark.reveal .letter:nth-child(1){ animation-delay: 0ms; }
  .wordmark.reveal .letter:nth-child(2){ animation-delay: 90ms; }
  .wordmark.reveal .letter:nth-child(3){ animation-delay: 180ms; }
  .wordmark.reveal .letter:nth-child(4){ animation-delay: 270ms; }
  .wordmark.reveal .letter:nth-child(5){ animation-delay: 360ms; }
  .wordmark.reveal .letter:nth-child(6){ animation-delay: 450ms; }
  @keyframes letterIn{
    0%{ opacity:0; transform:translateY(22px) scale(0.75); filter:blur(6px) drop-shadow(0 3px 2px rgba(0,0,0,0.35)); }
    65%{ opacity:1; transform:translateY(-4px) scale(1.06); filter:blur(0) drop-shadow(0 3px 2px rgba(0,0,0,0.35)); }
    100%{ opacity:1; transform:translateY(0) scale(1); filter:blur(0) drop-shadow(0 3px 2px rgba(0,0,0,0.35)); }
  }

  /* ---- tagline ---- */
  .tagline{
    margin-top:6px;
    color:var(--gray);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-weight:600;
    font-size:clamp(13px, 3vw, 17px);
    letter-spacing:0.01em;
    opacity:0;
    filter:blur(6px);
    transform:translateY(10px);
  }
  .tagline.reveal{
    animation: tagIn 0.7s cubic-bezier(.2,.8,.25,1) forwards;
  }
  @keyframes tagIn{
    0%{ opacity:0; filter:blur(6px); transform:translateY(10px); }
    100%{ opacity:1; filter:blur(0); transform:translateY(0); }
  }

  .replay-btn{
    margin-top:34px;
    background:transparent;
    color:#c9c3c1;
    border:1px solid rgba(255,255,255,0.18);
    padding:10px 22px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    opacity:0;
    transition: opacity 0.6s ease, border-color 0.25s ease, color 0.25s ease;
    position:relative;
    z-index:3;
  }
  .replay-btn:hover{
    border-color:rgba(209,28,25,0.6);
    color:#fff;
  }
  .replay-btn.show{ opacity:1; }
</style>
</head>

<script>
(function(){
  const ambientGlow = document.getElementById('ambientGlow');
  const flash = document.getElementById('flash');
  const particleLayer = document.getElementById('particleLayer');
  const sparkleLayer = document.getElementById('sparkleLayer');
  const partIcon = document.getElementById('part-icon');
  const wordmark = document.getElementById('wordmark');
  const tagline = document.getElementById('tagline');
  const sweep = document.getElementById('sweep');
  const replayBtn = document.getElementById('replayBtn');

  const SPARKLE_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0 L14.2 9.8 L24 12 L14.2 14.2 L12 24 L9.8 14.2 L0 12 L9.8 9.8 Z" fill="#f5d9d6"/></svg>';

  let emberEls = [];
  let sparkleEls = [];
  let stageTimers = [];

  function rand(min,max){ return min + Math.random()*(max-min); }

  function clearTimers(){
    stageTimers.forEach(t=>clearTimeout(t));
    stageTimers = [];
  }

  function buildEmbers(count){
    emberEls.forEach(e=>e.remove());
    emberEls = [];
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'ember';
      const size = rand(2,5);
      el.style.width = size+'px';
      el.style.height = size+'px';
      el.style.left = rand(6,94)+'%';
      el.style.setProperty('--rise', -(rand(340,620))+'px');
      el.style.setProperty('--drift', rand(-40,40)+'px');
      el.style.setProperty('--peak', rand(0.35,0.85));
      const dur = rand(5,10);
      const delay = rand(0,6);
      el.style.animationDuration = dur+'s';
      el.style.animationDelay = delay+'s';
      particleLayer.appendChild(el);
      emberEls.push(el);
    }
  }

  function buildSparkles(count){
    sparkleEls.forEach(e=>e.remove());
    sparkleEls = [];
    for(let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.innerHTML = SPARKLE_SVG;
      const size = rand(8,18);
      el.style.width = size+'px';
      el.style.height = size+'px';
      el.style.left = rand(10,90)+'%';
      el.style.top = rand(15,80)+'%';
      const dur = rand(2.4,4.5);
      const delay = rand(0,5);
      el.style.animationDuration = dur+'s';
      el.style.animationDelay = delay+'s';
      sparkleLayer.appendChild(el);
      sparkleEls.push(el);
    }
  }

  function activateEmbers(){
    emberEls.forEach(el=>el.classList.add('rise'));
  }
  function activateSparkles(){
    sparkleEls.forEach(el=>el.classList.add('twinkle'));
  }

  function resetAll(){
    clearTimers();
    ambientGlow.classList.remove('bloom','pulse');
    flash.classList.remove('fire');
    replayBtn.classList.remove('show');

    partIcon.classList.remove('reveal');
    partIcon.style.animation = 'none';
    void partIcon.offsetWidth;
    partIcon.style.animation = '';

    wordmark.classList.remove('reveal');
    void wordmark.offsetWidth;

    tagline.classList.remove('reveal');
    tagline.style.animation = 'none';
    void tagline.offsetWidth;
    tagline.style.animation = '';

    sweep.classList.remove('run');

    buildEmbers(46);
    buildSparkles(9);
  }

  function play(){
    resetAll();

    stageTimers.push(setTimeout(()=>{
      ambientGlow.classList.add('bloom');
    }, 120));

    stageTimers.push(setTimeout(()=>{
      activateEmbers();
      activateSparkles();
    }, 300));

    stageTimers.push(setTimeout(()=>{
      partIcon.classList.add('reveal');
      sweep.classList.add('run');
      flash.classList.add('fire');
    }, 1000));

    stageTimers.push(setTimeout(()=>{
      wordmark.classList.add('reveal');
    }, 2200));

    stageTimers.push(setTimeout(()=>{
      tagline.classList.add('reveal');
    }, 3300));

    stageTimers.push(setTimeout(()=>{
      ambientGlow.classList.add('pulse');
    }, 3900));

    stageTimers.push(setTimeout(()=>{
      replayBtn.classList.add('show');
    }, 4300));
  }

  replayBtn.addEventListener('click', play);
  window.addEventListener('load', ()=> setTimeout(play, 150));
})();
</script>
</body>
</html>
