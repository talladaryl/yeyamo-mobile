<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Yeyamo — Animation logo</title>
<style>
  :root{
    --dark-red:#d11c19;
    --light-red:#e07369;
    --gray:#757575;
    --shadow:#dcdcdc;
    --bg-1:#1a1414;
    --bg-2:#0c0a0a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(ellipse 80% 60% at 50% 38%, #2a1a18 0%, transparent 70%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow:hidden;
  }
  .stage{
    height:100%;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
  }
  .logo-wrap{
    width:min(70vw, 420px);
    filter: drop-shadow(0 30px 60px rgba(209,28,25,0.15));
  }
  svg#logo{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
  }
  #logo path{
    fill-opacity:0;
    stroke-opacity:1;
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
    transition: fill-opacity 0.5s ease, stroke-opacity 0.6s ease 0.35s;
  }
  #logo path.p-icon-dark, #logo path.p-text-dark{
    stroke:var(--dark-red);
    fill:var(--dark-red);
  }
  #logo path.p-icon-light, #logo path.p-text-light{
    stroke:var(--light-red);
    fill:var(--light-red);
  }
  #logo path.p-tagline{
    stroke:var(--gray);
    fill:var(--gray);
  }
  #logo path.drawn{
    fill-opacity:1;
  }
  #logo path.filled-settled{
    stroke-opacity:0;
  }
  #shadow-ellipse{
    fill:var(--shadow);
    opacity:0;
    transition: opacity 1s ease;
  }
  #shadow-ellipse.show{ opacity:1; }

  .replay-btn{
    margin-top:38px;
    background:transparent;
    color:#c9c3c1;
    border:1px solid rgba(255,255,255,0.18);
    padding:10px 22px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    opacity:0;
    transition: opacity 0.6s ease, border-color 0.25s ease, color 0.25s ease;
  }
  .replay-btn:hover{
    border-color:rgba(209,28,25,0.6);
    color:#fff;
  }
  .replay-btn.show{ opacity:1; }
</style>
</head>

<script>
(function(){
  const svg = document.getElementById('logo');
  const shadow = document.getElementById('shadow-ellipse');
  const replayBtn = document.getElementById('replayBtn');

  const STAGGER = 18;      // ms between path starts within a group
  const DRAW_MS = 900;     // stroke draw duration
  const FILL_MS = 500;     // fill fade-in duration after draw

  function prepPath(p){
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.classList.remove('drawn','filled-settled');
  }

  function resetAll(){
    document.querySelectorAll('#logo path').forEach(prepPath);
    shadow.classList.remove('show');
    replayBtn.classList.remove('show');
  }

  function drawGroup(paths, opts={}){
    return new Promise(resolve=>{
      const stagger = opts.stagger ?? STAGGER;
      paths.forEach((p,i)=>{
        setTimeout(()=>{
          p.style.transition = `stroke-dashoffset ${DRAW_MS}ms cubic-bezier(.4,.1,.2,1)`;
          p.style.strokeDashoffset = '0';
        }, i*stagger);
      });
      const total = (paths.length-1)*stagger + DRAW_MS;
      setTimeout(()=>{
        paths.forEach(p=>p.classList.add('drawn'));
        setTimeout(()=>{
          paths.forEach(p=>p.classList.add('filled-settled'));
          resolve();
        }, FILL_MS);
      }, total);
    });
  }

  async function play(){
    resetAll();
    // force reflow so dasharray/offset resets apply before transitions
    void svg.getBoundingClientRect();

    const iconPaths = Array.from(document.querySelectorAll('#g-icon path'));
    const textPaths = Array.from(document.querySelectorAll('#g-text path'));
    const tagPaths  = Array.from(document.querySelectorAll('#g-tagline path'));

    await new Promise(r=>setTimeout(r,150));
    shadow.classList.add('show');
    await drawGroup(iconPaths, {stagger:14});
    await new Promise(r=>setTimeout(r,120));
    await drawGroup(textPaths, {stagger:45});
    await new Promise(r=>setTimeout(r,80));
    await drawGroup(tagPaths, {stagger:10});

    replayBtn.classList.add('show');
  }

  replayBtn.addEventListener('click', play);
  window.addEventListener('load', ()=> setTimeout(play, 200));
})();
</script>
